<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Notizie AI by FAIND</title>
<base target="_blank">
<style>
  :root { --bg: #fff; --ink: #0E1222; --muted: #5d6880; --rule: #e1e6ef; --blue: #4293B9; }
  :root[data-theme="dark"] { --bg: #0E1222; --ink: #fff; --muted: #9fb0c9; --rule: #252c44; }
  @media (prefers-color-scheme: dark) { :root[data-theme="auto"] { --bg: #0E1222; --ink: #fff; --muted: #9fb0c9; --rule: #252c44; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #0E1222; color: #fff; }
  header img { height: 30px; width: auto; border-radius: 4px; display: block; }
  header span { font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #8FD0F0; margin-left: auto; }
  ol { list-style: none; flex: 1; overflow: auto; }
  li { border-bottom: 1px solid var(--rule); }
  li a { display: block; padding: 11px 14px; color: var(--ink); text-decoration: none; }
  li a:hover b { text-decoration: underline; }
  li b { display: block; font-weight: 650; font-size: 15px; }
  li small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .msg { padding: 18px 14px; color: var(--muted); }
  footer a { display: block; text-align: center; padding: 12px 14px; background: var(--blue); color: #fff; font-weight: 750; text-decoration: none; font-size: 14.5px; }
</style>
</head>
<body>
<header><a href="https://faind.org/"><img src="assets/logo.webp" width="96" height="30" alt="FAIND – Flash AI News Daily"></a><span id="lab">Notizie AI</span></header>
<ol id="list"><li class="msg" id="msg">…</li></ol>
<footer><a id="all" href="https://faind.org/">Tutte le notizie su FAIND →</a></footer>
<script>
/* Widget "Notizie AI by FAIND": parametri n (3–10), lang (it|en|fr|de), theme (light|dark|auto) */
(function () {
  var SITE = 'https://faind.org/';
  var q = new URLSearchParams(location.search);
  var T = {
    it: { lab: 'Notizie AI', all: 'Tutte le notizie su FAIND →', none: 'Nessuna notizia al momento.', err: 'Notizie non disponibili. Apri FAIND per leggerle.', loc: 'it-IT' },
    en: { lab: 'AI news', all: 'All the news on FAIND →', none: 'No news right now.', err: 'News unavailable. Open FAIND to read it.', loc: 'en-GB' },
    fr: { lab: 'Actualités IA', all: 'Toutes les actualités sur FAIND →', none: 'Aucune actualité pour le moment.', err: 'Actualités indisponibles. Ouvrez FAIND pour les lire.', loc: 'fr-FR' },
    de: { lab: 'KI-Nachrichten', all: 'Alle Nachrichten auf FAIND →', none: 'Derzeit keine Nachrichten.', err: 'Nachrichten nicht verfügbar. Öffne FAIND, um sie zu lesen.', loc: 'de-DE' }
  };
  var lang = T[q.get('lang')] ? q.get('lang') : 'it', t = T[lang];
  var n = Math.min(10, Math.max(3, parseInt(q.get('n'), 10) || 5));
  var theme = /^(light|dark|auto)$/.test(q.get('theme')) ? q.get('theme') : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.lang = lang;
  document.getElementById('lab').textContent = t.lab;
  document.getElementById('all').textContent = t.all;
  var list = document.getElementById('list');
  function tx(v) { return v == null ? '' : typeof v === 'string' ? v : (v[lang] || v.it || v.en || ''); }
  function say(s) { list.innerHTML = ''; var li = document.createElement('li'); li.className = 'msg'; li.textContent = s; list.appendChild(li); }
  var fmt = new Intl.DateTimeFormat(t.loc, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  fetch('news.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
    var items = (d.items || []).filter(function (x) { return x && x.title && x.link && x.link.url; })
      .sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    // prima le notizie nella lingua scelta, poi (se non bastano) quelle in inglese e le altre
    var mine = items.filter(function (x) { return (x.lang || 'it') === lang; });
    var en = items.filter(function (x) { return (x.lang || 'it') !== lang && x.lang === 'en'; });
    var rest = items.filter(function (x) { return (x.lang || 'it') !== lang && x.lang !== 'en'; });
    var pick = mine.concat(en, rest).slice(0, n);
    if (!pick.length) return say(t.none);
    list.innerHTML = '';
    pick.forEach(function (x) {
      var li = document.createElement('li'), a = document.createElement('a'), b = document.createElement('b'), s = document.createElement('small');
      a.href = x.page ? SITE + x.page : x.link.url; a.rel = 'noopener';
      b.textContent = tx(x.title);
      s.textContent = ((x.source && x.source.name) || '') + ' · ' + fmt.format(new Date(x.date));
      a.appendChild(b); a.appendChild(s); li.appendChild(a); list.appendChild(li);
    });
  }).catch(function () { say(t.err); });
})();
</script>
</body>
</html>
