# FAIND — aggiorna le notizie e pubblica il sito
# Gira a ogni push, ogni ora e a mano (Actions → "Aggiorna notizie" → Run workflow).
# Requisito: Settings → Pages → Source = "GitHub Actions".

name: Aggiorna notizie

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"     # ogni ora al minuto 17 (orario UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write              # per le segnalazioni automatiche (es. chiave Buffer in scadenza)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false   # il sito non usa pacchetti npm

      - id: pages
        uses: actions/configure-pages@v6

      - name: Raccolta notizie dai feed
        run: node scripts/fetch-news.mjs
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}/news.json

      - name: Pubblica su Telegram
        run: node scripts/telegram.mjs
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Pubblica su LinkedIn (tramite Buffer)
        run: node scripts/linkedin.mjs
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblica gli short su YouTube (tramite Buffer)
        run: node scripts/youtube.mjs
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
