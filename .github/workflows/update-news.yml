# FAIND — aggiorna le notizie e pubblica il sito
# Gira a ogni push, ogni ora e a mano (Actions → "Aggiorna notizie" → Run workflow).
# Requisito: Settings → Pages → Source = "GitHub Actions".

name: Aggiorna notizie

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"     # ogni ora al minuto 17 (orario UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write              # per le segnalazioni automatiche (es. chiave Buffer in scadenza)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: pages
        uses: actions/configure-pages@v5

      - name: Raccolta notizie dai feed
        run: node scripts/fetch-news.mjs
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}/news.json

      - name: Pubblica su Telegram
        run: node scripts/telegram.mjs
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Pubblica su LinkedIn (tramite Buffer)
        run: node scripts/linkedin.mjs
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
